<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111217" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>World Bible</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <button class="icon-btn mobile-only" id="close-sidebar" aria-label="Close navigation">×</button>
        <div>
          <div class="eyebrow">PRIVATE WORKSPACE</div>
          <div class="brand" id="project-name">Galatea</div>
        </div>
      </div>

      <nav class="primary-nav" aria-label="Primary">
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/entries" data-route="entries">All Lore</a>
        <a href="#/world" data-route="world">World</a>
        <a href="#/characters" data-route="characters">Characters</a>
        <a href="#/geography" data-route="geography">Geography</a>
        <a href="#/maps" data-route="maps">Maps</a>
        <a href="#/history" data-route="history">History</a>
        <a href="#/story" data-route="story">Story</a>
        <a href="#/mysteries" data-route="mysteries">Mysteries</a>
        <a href="#/timeline" data-route="timeline">Timeline</a>
        <a href="#/media" data-route="media">Media</a>
        <a href="#/ideas" data-route="ideas">Idea Inbox</a>
        <a href="#/questions" data-route="questions">Questions</a>
        <a href="#/settings" data-route="settings">Settings & Data</a>
      </nav>

      <div class="sidebar-footer">
        <button class="button ghost full" id="random-entry">Random lore entry</button>
        <div class="muted small">Local-first • no account required</div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="open-sidebar" aria-label="Open navigation">☰</button>
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="global-search" type="search" placeholder="Search lore, notes, tags, chapters…" autocomplete="off" />
          <div class="search-popover hidden" id="search-popover"></div>
        </div>
        <button class="button primary" id="quick-add">+ Quick Add</button>
      </header>

      <main id="main" class="main-content" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="entry-dialog" class="editor-dialog">
    <form method="dialog" id="entry-form">
      <div class="dialog-header">
        <div>
          <div class="eyebrow">ENTRY EDITOR</div>
          <h2 id="entry-dialog-title">New entry</h2>
        </div>
        <button type="button" class="icon-btn" id="close-entry-dialog" aria-label="Close editor">×</button>
      </div>
      <div class="dialog-body" id="entry-form-body"></div>
      <div class="dialog-footer">
        <button type="button" class="button danger ghost hidden" id="delete-entry">Delete permanently</button>
        <span class="spacer"></span>
        <button type="button" class="button ghost" id="cancel-entry">Cancel</button>
        <button type="submit" class="button primary">Save entry</button>
      </div>
    </form>
  </dialog>

  <dialog id="relation-dialog" class="small-dialog">
    <form method="dialog" id="relation-form">
      <div class="dialog-header">
        <div>
          <div class="eyebrow">STRUCTURED LINK</div>
          <h2>Add relationship</h2>
        </div>
        <button type="button" class="icon-btn" id="close-relation-dialog" aria-label="Close">×</button>
      </div>
      <div class="dialog-body compact">
        <input type="hidden" id="relation-from" />
        <label>Relationship
          <select id="relation-type" required></select>
        </label>
        <label>Related entry
          <select id="relation-to" required></select>
        </label>
        <label>Note <span class="muted">(optional)</span>
          <textarea id="relation-note" rows="3"></textarea>
        </label>
      </div>
      <div class="dialog-footer">
        <button type="button" class="button ghost" id="cancel-relation">Cancel</button>
        <button type="submit" class="button primary">Add link</button>
      </div>
    </form>
  </dialog>

  <dialog id="media-dialog" class="small-dialog">
    <form method="dialog" id="media-form">
      <div class="dialog-header">
        <div>
          <div class="eyebrow">MEDIA LIBRARY</div>
          <h2>Add media</h2>
        </div>
        <button type="button" class="icon-btn" id="close-media-dialog" aria-label="Close">×</button>
      </div>
      <div class="dialog-body compact">
        <label>File
          <input id="media-file" type="file" accept="image/*" required />
        </label>
        <label>Title
          <input id="media-title" type="text" placeholder="Map, sketch, symbol…" />
        </label>
        <label>Tags
          <input id="media-tags" type="text" placeholder="map, continent, concept" />
        </label>
        <label>Link to entries
          <select id="media-entries" multiple size="8"></select>
        </label>
      </div>
      <div class="dialog-footer">
        <button type="button" class="button ghost" id="cancel-media">Cancel</button>
        <button type="submit" class="button primary">Add media</button>
      </div>
    </form>
  </dialog>

  <input id="import-file" type="file" accept="application/json,.json" class="hidden" />
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
